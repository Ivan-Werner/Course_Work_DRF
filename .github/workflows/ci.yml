name: Course_Work_DRF

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run flake8
        run: flake8 .


  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    - name: Run tests
      env:
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
      run: python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Log in in Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin
      - name: Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/app:${{ github.sha }} .
      - name: Push to Docker hub
        run: |
          docker tag ${{ secrets.DOCKER_HUB_USERNAME }}/app:${{ github.sha }} ${{ secrets.DOCKER_HUB_USERNAME }}/app:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Check out
        uses: actions/checkout@v3
      - name: Create .env file
        uses: SpicyPizza/create-envfile@v2
        with:
          envkey_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          envkey_NAME: ${{ secrets.NAME }}
          envkey_USER: ${{ secrets.USER }}
          envkey_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          envkey_DB_HOST: ${{ secrets.DB_HOST }}
          envkey_CELERY_BROKER_URL: ${{ secrets.CELERY_BROKER_URL }}
          envkey_CELERY_RESULT_BACKEND: ${{ secrets.CELERY_RESULT_BACKEND }}
          envkey_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}


#      - name: Deploy to server
#        run: |
#          scp -v -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.USER_NAME }}@${{ secrets.SERVER_IP }}:/app
#          scp -v -o StrictHostKeyChecking=no nginx.conf ${{ secrets.USER_NAME }}@${{ secrets.SERVER_IP }}:/app
#          scp -v -o StrictHostKeyChecking=no .env ${{ secrets.USER_NAME }}@${{ secrets.SERVER_IP }}:/app
#          ssh -v -o StrictHostKeyChecking=no ${{ secrets.USER_NAME }}@${{ secrets.SERVER_IP }} << EOF
#          cd /app
#          docker compose pull || sudo docker compose pull
#          docker compose down --remove-orphans || true || sudo docker compose down --remove-orphans
#          docker compose up -d --force-recreate || sudo docker compose up -d --force-recreate
#          EOF

      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: |
        # Копируем все необходимые файлы
          scp -o StrictHostKeyChecking=no docker-compose.yml $SERVER_USER@$SERVER_IP:/app/
          scp -o StrictHostKeyChecking=no Dockerfile $SERVER_USER@$SERVER_IP:/app/
          scp -o StrictHostKeyChecking=no requirements.txt $SERVER_USER@$SERVER_IP:/app/
          scp -o StrictHostKeyChecking=no -r habits/ $SERVER_USER@$SERVER_IP:/app/
          scp -o StrictHostKeyChecking=no -r users/ $SERVER_USER@$SERVER_IP:/app/
          scp -o StrictHostKeyChecking=no manage.py $SERVER_USER@$SERVER_IP:/app/

         # Запускаем деплой
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "
          cd /app &&
          sudo docker-compose down &&
          sudo docker-compose up -d --build
